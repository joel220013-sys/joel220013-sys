name: Update GitHub Profile

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate_profile.py"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate profile README
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_OWNER: ${{ github.repository_owner }}
        run: python scripts/generate_profile.py

      - name: Add animated portrait
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("README.md")
          s = p.read_text(encoding="utf-8")
          marker = '### Cybersecurity • Full-Stack Engineering • Applied AI • Ethical Hacking\n'
          portrait = '''\n<p align="center">\n  <img src="https://raw.githubusercontent.com/joel220013-sys/joel220013-sys/main/assets/joel-avatar.svg" width="220" alt="Joel animated portrait" />\n</p>\n'''
          if "assets/joel-avatar.svg" in s:
              raise SystemExit("Animated portrait already present")
          if marker not in s:
              raise SystemExit("Profile heading marker not found")
          p.write_text(s.replace(marker, marker + portrait, 1), encoding="utf-8")
          PY

      - name: Commit generated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No profile changes detected."
          else
            git commit -m "chore: refresh generated GitHub profile"
            git push
          fi
